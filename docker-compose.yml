services:
  postgres:
    image: postgres:16-alpine
    container_name: crmto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crmto
      POSTGRES_PASSWORD: crmto_dev_password
      POSTGRES_DB: crmto
    ports:
      - "5432:5432"
    volumes:
      - crmto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crmto"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  crmto_pgdata:
